ru:
  command:
    sethealth:
      description: 'Установить здоровье персонажа на заданное значение.'
      syntax: <цель> <значение>
      notification: 'Ваше здоровье установлено на {health}.'
      message: '{player} установил(а) здоровье {target} на {health}.'
    setarmor:
      description: 'Установить броню персонажа на заданное значение.'
      syntax: <цель> <значение>
      notification: 'Ваша броня установлена на {armor}.'
      message: '{player} установил(а) броню {target} на {armor}.'
    report:
      description: 'Сообщить администрации о проблеме.'
      syntax: <сообщение>
    message:
      description: 'Отправить личное сообщение другому игроку.'
      syntax: <цель> <сообщение>
  error:
    sethealth:
      invalid_value: '[ОШИБКА] {health} - недопустимое значение здоровья.'
    setarmor:
      invalid_value: '[ОШИБКА] {armor} - недопустимое значение брони.'

fr:
  command:
    sethealth:
      description: "Règle la santé d'un personnage sur une valeur personnalisée."
      syntax: "<cible> <valeur>"
      notification: "Votre santé a été réglée sur {health}."
      message: "{player} a réglé la santé de {target} sur {health}."
    setarmor:
      description: "Règle l'armure d'un personnage sur une valeur personnalisée."
      syntax: "<cible> <valeur>"
      notification: "Votre armure a été réglée sur {armor}."
      message: "{player} a réglé l'armure de {target} sur {armor}."
    report:
      description: "Signale aux membres de l'équipe ces problèmes agaçants."
      syntax: "<message>"
    message:
      description: "Envoie un message privé à un autre joueur."
      syntax: "<cible> <message>"
  error:
    sethealth:
      invalid_value: "[ERREUR] {health} n'est pas une valeur de santé valide."
    setarmor:
      invalid_value: "[ERREUR] {armor} n'est pas une valeur d'armure valide."

  vortigaunt:
    name: ui.voice_lines.category.vortigaunt
    order: 30
    factions:
      - vortigaunt
    lines:
      nodistance:
        sound: "vo/npc/vortigaunt/vmono_04.wav"
        text: "There is no distance between us. No false veils of time or space may intervene."
        aliases:
          - "no distance"
      betweenworlds:
        sound: "vo/npc/vortigaunt/vmono_07.wav"
        text: "For a brief time you joined us. You are one. Between the worlds."
        aliases:
          - "between worlds"
      communionvortessence:
        sound: "vo/npc/vortigaunt/vmono_08.wav"
        text: "Communion of the vortessence. And that other: a deeper mystery. No deeper than the void itself."
        aliases:
          - "communion of the vortessence"
      cutcords:
        sound: "vo/npc/vortigaunt/vmono_09.wav"
        text: "We cannot forget those whose cords you cut. Forgiveness is not ours to bestow."
        aliases:
          - "cut cords"
      unityofpurpose:
        sound: "vo/npc/vortigaunt/vmono_10.wav"
        text: "Unity of purpose, the shattering of common shackles, a single road we tread."
        aliases:
          - "unity of purpose"
      singforeternity:
        sound: "vo/npc/vortigaunt/vmono_11.wav"
        text: "Your song we sing and shall sing for eternity. No matter the consequences of this struggle."
        aliases:
          - "sing for eternity"
      griefjubilation:
        sound: "vo/npc/vortigaunt/vmono_12.wav"
        text: "You have brought us grief and jubilation beyond measure."
        aliases:
          - "grief and jubilation"
      finalstroke:
        sound: "vo/npc/vortigaunt/vmono_13.wav"
        text: "We are there still, in observance of your final stroke."
        aliases:
          - "final stroke"
      talismanofvictory:
        sound: "vo/npc/vortigaunt/vmono_16.wav"
        text: "With you besides us, a talisman of victory, the day of freedom draws nigh."
        aliases:
          - "talisman of victory"
      darkmask:
        sound: "vo/npc/vortigaunt/vmono_17.wav"
        text: "Your bright face obscures your darker mask."
        aliases:
          - "dark mask"
      sib:
        sound: "vo/npc/vortigaunt/vmono_18.wav"
        text: "We call you sib, although your mind and meaning are a mystery to us."
      distanteyes:
        sound: "vo/npc/vortigaunt/vmono_19.wav"
        text: "Far distant eyes look out through yours."
        aliases:
          - "distant eyes"
      secretsteers:
        sound: "vo/npc/vortigaunt/vmono_20.wav"
        text: "Something secret steers us both. We shall not name it."
        aliases:
          - "secret steers"
      chafingbonds:
        sound: "vo/npc/vortigaunt/vmono_21.wav"
        text: "We have endured these chafing bonds for eons, yet a single moment of further servitude seems intolerable!"
        aliases:
          - "chafing bonds"
      ouryoke:
        sound: "vo/npc/vortigaunt/vmono_22.wav"
        text: "How often have we slipped our yoke, only to find it choking us again."
        aliases:
          - "our yoke"
      totalvictory:
        sound: "vo/npc/vortigaunt/vmono_23.wav"
        text: "Let this war end in either total victory or our extinction. No further compromise shall we allow."
        aliases:
          - "total victory"
      miserablerock:
        sound: "vo/npc/vortigaunt/vmono_24.wav"
        text: "We take our stand beside you, here, upon this miserable rock."
        aliases:
          - "miserable rock"
      darkahead:
        sound: "vo/npc/vortigaunt/vmono_25.wav"
        text: "The way ahead is dark for the moment."
        aliases:
          - "the way ahead is dark"
      sacrificetous:
        sound: "vo/npc/vortigaunt/vmono_26.wav"
        text: "What seems to you a sacrifice is merely, to us, an oscillation. We do not fear the interval of darkness."
        aliases:
          - "sacrifice is merely"
      tapestry:
        sound: "vo/npc/vortigaunt/vmono_27.wav"
        text: "We are a tapestry woven of vortessence. It is the same for you if only you would see it."
      hopesanddreams:
        sound: "vo/npc/vortigaunt/vmono_28.wav"
        text: "How many are there in you? Whose hopes and dreams do you encompass?"
        aliases:
          - "hopes and dreams"
      eyesinside:
        sound: "vo/npc/vortigaunt/vmono_29.wav"
        text: "Could you but see the eyes inside your own, the minds in your mind, you would see how much we share."
        aliases:
          - "eyes inside"
      languagecourtesy:
        sound: "vo/coast/vgossip_02.wav"
        text: "Yes, we will vocalize in your auditory language as a matter of courtesy."
        aliases:
          - "language courtesy"
      unflatteringthings:
        sound: "vo/coast/vgossip_03.wav"
        text: "Unless we wish to say unflattering things about you."
        aliases:
          - "unflattering things"
      justso:
        sound: "vo/coast/vgossip_04.wav"
        text: "Just so."
      affirmed:
        sound: "vo/npc/vortigaunt/affirmed.wav"
        text: "Affirmed."
      alldear:
        sound: "vo/npc/vortigaunt/alldear.wav"
        text: "We have lost all dear to us."
        aliases:
          - "all dear"
      allfornow:
        sound: "vo/npc/vortigaunt/allfornow.wav"
        text: "That is all for now."
        aliases:
          - "all for now"
      allinoneinall:

# Voice lines of the HL2RP schema, loaded into the Voice Lines plugin by the
# RegisterVoiceLines handler of the schema.
#
# Every category has:
#   name     the language phrase shown as the title of the category.
#   order    categories with a lower order are listed and matched first.
#   factions the IDs of the factions whose members may use the lines. A category without
#            factions is open to every character.
#   ranks    optional map of faction ID to rank ID: members of that faction need the rank
#            or a higher one.
#   lines    the voice lines, keyed by the command that says them.
#
# Every line has:
#   sound    a path relative to the sound folder, or a map of gender (male, female) to path.
#   text     what the character says in the chat, or a map of gender to text. A text that
#            starts and ends with an asterisk is said as an action; such a line is said
#            with its command or an alias only.
#   aliases  optional list of other phrases that say the line.
#
# A message says a line when, ignoring letter case and the punctuation at its end, it is the
# command of the line, its text or one of its aliases.
#
# A message made of the commands and aliases of several lines, separated by spaces, says them
# one after the other, each once the sound of the one before it has ended. A comma after a
# command adds a pause of one second before the next line, a period two seconds:
#   figures dwell, later. same
# A chain says at most as many lines as the voice_lines_max_chain config allows (6 by
# default), and every word of it has to belong to a command or an alias of a line the
# character may use: a message that is longer, or that holds anything else, is ordinary
# speech.

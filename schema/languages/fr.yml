      description: "Une carte d'accès du Cartel de haute technologie, utilisée par les unités ordinaires de la Protection civile. Elle fonctionne grâce au propre champ électrique du corps. Elle transmet les données en se servant du sel du corps comme support de transmission."
    card_cp_officer:
      print_name: "Carte d'accès d'officier de la Protection civile"
      description: "Une carte d'accès du Cartel de haute technologie, utilisée par les officiers de la Protection civile. Elle fonctionne grâce au propre champ électrique du corps. Elle transmet les données en se servant du sel du corps comme support de transmission."

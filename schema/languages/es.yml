es:
  class:
    citizen:
      title: Ciudadano
      desc: Un residente corriente de la ciudad, sin tareas asignadas por el Combine.
    recruit:
      title: Recluta
      desc: Una unidad de Protección Civil recién alistada que patrulla las calles.
    slave:
      title: Vortigaunt esclavizado
      desc: Un vortigaunt encadenado al que el Combine obliga a hacer trabajos serviles.
    soldier:
      title: Soldado
      desc: Un soldado transhumano del Overwatch del Combine.
    vortigaunt:
      title: Vortigaunt
      desc: Un vortigaunt libre que se oculta del Combine.
    zombie:
      title: Zombi
      desc: Un headcrab o el cuerpo del que se ha apoderado.
  currency:
    tokens: Fichas
  faction:
    admin:
      title: Administrador de la Ciudad
      desc: La persona que controla la ciudad.
      phys_desc: Viste un traje elegante y sobrio.
    citizen:
      title: Ciudadano
      desc: Un ciudadano corriente que vive bajo la autoridad del Combine.
      phys_desc: Viste ropa de ciudadano sucia.
    vortigaunt:
      title: Vortigaunt
      description: Un alienígena de Xen, perseguido y esclavizado por el Combine.
      phys_desc: Una criatura encorvada de piel verde con un gran ojo rojo.
    zombie:
      title: Zombi
      description: Un headcrab o un cuerpo del que se ha apoderado.
      phys_desc: Un cuerpo destrozado con un headcrab aferrado a la cabeza.
    combine:
      overwatch:
        title: Overwatch del Combine
        desc: Soldados militares del Combine.
        phys_desc: Lleva una pesada armadura de Overwatch.
      cca:
        title: Protección Civil
        desc: Fuerzas policiales del Combine.
        phys_desc: Lleva un reluciente uniforme de Protección Civil con una porra eléctrica nueva en el cinturón.
  item:
    action:
      eat: Comer
      drink: Beber
    category:
      cards: Tarjetas de acceso
    card_cp:
      print_name: Tarjeta de acceso de Protección Civil
      description: Una tarjeta de acceso Combine de alta tecnología que usan las unidades corrientes de Protección Civil. Funciona con el propio campo eléctrico del cuerpo. Transmite datos usando la sal del cuerpo como medio de transmisión.
    card_cp_officer:
      print_name: Tarjeta de acceso de oficial de Protección Civil
      description: Una tarjeta de acceso Combine de alta tecnología que usan los oficiales de Protección Civil. Funciona con el propio campo eléctrico del cuerpo. Transmite datos usando la sal del cuerpo como medio de transmisión.
    cca_uniform:
      print_name: Uniforme de Protección Civil
      description: Uniforme de unidad de Protección Civil con un par de botas negras y una máscara de gas.
    breens_water:
      print_name: Agua de Breen
      description: Una lata de color azul llena de agua. Lleva impreso 'Reserva privada de Breen'.
    breens_water_gas:
      print_name: Agua de Breen con gas
      description: "Una lata de color rojo llena de agua con gas. 'Un sabor diferente.' - Breen"
    breens_water_limited:
      print_name: Agua de Breen con sabor
      description: "Una lata de color amarillo llena de una clase de agua limitada. 'Solo para leales.' - Breen"
    food_waterbottle:
      print_name: Botella de agua
      description: Una botella de plástico con agua. Refrescante.
    food_whiskey:
      print_name: Botella de whisky
      description: Una botella de cristal de 375 ml con un licor fuerte. Huele a trigo fermentado.
    food_vodka:
      print_name: Botella de vodka
      description: Una botella de cristal de 375 ml con un licor fuerte. Huele a etanol.
    food_rum:
      print_name: Una botella de ron
      description: Una botella de cristal de 375 ml con un licor fuerte. Huele a azúcar fermentado.
    food_gin:
      print_name: Una botella de ginebra
      description: Una botella de cristal de 375 ml con un licor fuerte. Huele a bayas fermentadas.
    food_headcrab:
      print_name: Carne de headcrab
      description: Un trozo de headcrab cocinado. Sabe a pollo, pero más soso y duro.
    food_pheadcrab:
      print_name: Carne de headcrab venenoso tratada
      description: Un trozo de headcrab venenoso cocinado y tratado. Se te duermen un poco los labios al comerlo...
    food_melon:
      print_name: Melón
      description: Una esfera verde y deformada. Por dentro es rosada.
    food_milk:
      print_name: Botella de leche
      description: Un galón de leche en un envase de plástico.
    canned_food:
      print_name: Comida enlatada marca Combine
      description: Envase de plástico repleto de, huh... comida sintética.
    medical_bandage:
      print_name: Venda esterilizada
      description: Un rollo fino de vendas estériles.
    medical_fak:
      print_name: Botiquín de primeros auxilios
      description: Un equipo profesional de primeros auxilios.
    pistol:
      print_name: Pistola de 9 mm
      description: Un arma compacta que dispara balas de 9x19 mm.
      ammo:
        print_name: Munición de 9 mm
        description: Un contenedor metálico lleno de balas de 9x19 mm.
    smg:
      print_name: Subfusil
      description: Un arma de defensa personal compacta que dispara balas de 4,6x30 mm.
      ammo:
        print_name: Munición de 4,6x30 mm
        description: Un contenedor metálico lleno de balas de 4,6x30 mm.
        grenade:
          print_name: Granada de subfusil
          description: Un explosivo que puede usarse como munición del lanzagranadas del subfusil.
    shotgun:
      print_name: SPAS-12
      description: Una escopeta usada sobre todo por los equipos de guardias de prisión de Overwatch. Dispara cartuchos del calibre 12.
      ammo:
        print_name: Calibre 12
        description: Una caja de cartón llena de munición del calibre 12.
    revolver:
      print_name: "Magnum .357"
      description: Un revólver reluciente de antes de la guerra que dispara balas .357 Magnum.
      ammo:
        print_name: "Balas .357 Magnum"
        description: Una caja de cartón llena de balas .357 Magnum.
    ar2:
      print_name: Rifle de pulso (AR2)
      description: Rifle de Pulso Edición Estándar Overwatch. Dispara energía oscura concentrada así como orbes.
      ammo:
        print_name: Energía de rifle de pulso
        description: Un pequeño cargador de metal que contiene cargas de energía oscura.
      core:
        print_name: Núcleo de energía de rifle de pulso
        description: Energía oscura concentrada en el interior de una esfera de metal.
    crossbow:
      print_name: Ballesta
      description: Un arma de fabricación tosca que dispara virotes al rojo vivo.
      ammo:
        print_name: Virotes de ballesta
        description: Pequeñas piezas de metal que pueden usarse como munición de ballesta.
    crowbar:
      print_name: Palanca
      description: Palanca de color rojo. Qué más puedo decir sobre ella.
    rpg:
      print_name: RPG
      description: Un arma de grado militar. Ten cuidado, puede no disparar por el lado deseado.
      ammo:
        print_name: Misil de RPG
        description: Un misil naranja, usado normalmente con un RPG.
    stunstick:
      print_name: Porra eléctrica
      description: Porra reglamentaria de la CPC con una funcionalidad especial para neutralizar enemigos.
    grenade:
      print_name: Granada
      description: Un pequeño tubo redondo lleno de sustancias explosivas.
